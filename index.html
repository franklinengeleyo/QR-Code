<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> 
        <p>Enter your URL</p>
        <input type="text" placeholder="Enter URL" id="qrText">
        <div id="imgBox">
            <img src="" id="qrImage">
        </div>
        <button onclick="generateQR()">Generat QR Code</button>
    </div>

    <script>
        
let imgBox = document.querySelector("#imgBox");
let qrText = document.querySelector("#qrText");
let qrImage = document.querySelector("#qrImage");

function generateQR() {
    if (qrText.value.trim().length > 0) {
        qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="
            + encodeURIComponent(qrText.value.trim());

        imgBox.classList.add("show-img");

    } else {
        qrText.classList.add("error");

        setTimeout(() => {
            qrText.classList.remove("error");
        }, 1000);
    }
}

    </script>
</body>
</html>
